name: CI — Lint, Tests & Smoke Train

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff + Pytest + Smoke Train
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tokenizers pytest ruff pyyaml numpy

      - name: Ruff lint check
        run: ruff check model/ alignment/ eval/ tokenizer/ data/ inference/ --line-length 100

      - name: Run unit tests
        run: pytest model/tests/ -v --tb=short

      - name: Tokenizer round-trip smoke test
        run: |
          python - <<'EOF'
          from tokenizers import ByteLevelBPETokenizer
          import tempfile, os, pathlib

          # Build a tiny tokenizer and verify round-trip
          corpus = ["Hello world! Building an LLM from scratch."] * 10
          with tempfile.NamedTemporaryFile(mode="w", suffix=".txt", delete=False) as f:
              f.write("\n".join(corpus))
              tmp = f.name

          tok = ByteLevelBPETokenizer()
          tok.train([tmp], vocab_size=500, min_frequency=1,
                    special_tokens=["<pad>","<bos>","<eos>","<unk>"])
          os.unlink(tmp)

          text = "Hello world!"
          ids = tok.encode(text).ids
          decoded = tok.decode(ids)
          assert text in decoded or decoded.strip() == text.strip(), \
              f"Round-trip failed: {decoded!r}"
          print("Tokenizer round-trip OK")
          EOF

      - name: Smoke train (tiny model, 5 steps)
        run: |
          python - <<'EOF'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path.cwd()))
          import argparse, model.train as t

          args = argparse.Namespace(
              config=None,
              data_dir=None,
              checkpoint_dir="/tmp/smoke_ckpt",
              batch_size=2,
              total_steps=5,
              warmup_steps=1,
              lr=1e-4,
              grad_clip=1.0,
              log_interval=1,
              checkpoint_interval=100,
          )
          t.train(args)
          print("Smoke train OK")
          EOF
