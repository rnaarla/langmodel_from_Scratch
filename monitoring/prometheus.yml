global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "llm-api"
    static_configs:
      - targets: ["llm-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "dcgm-exporter"
    # GPU metrics via NVIDIA DCGM exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
